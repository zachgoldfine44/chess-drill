const pieceImgUrl = p => `https://images.chesscomfiles.com/chess-themes/pieces/neo/150/${PIECE_IMG_CODE[p]}.png`;
const INIT_BOARD = () => [
  ["r","n","b","q","k","b","n","r"],["p","p","p","p","p","p","p","p"],
  [null,null,null,null,null,null,null,null],[null,null,null,null,null,null,null,null],

  ["P","P","P","P","P","P","P","P"],["R","N","B","Q","K","B","N","R"],
];
const sq = s => [8-parseInt(s[1]), s.charCodeAt(0)-97];
const toAlg = (r,c) => String.fromCharCode(97+c) + (8-r);
const applyMove = (board, from, to, extra) => {
  const b = board.map(r=>[...r]);
  const [fr,fc]=sq(from),[tr,tc]=sq(to);
  b[tr][tc]=b[fr][fc]; b[fr][fc]=null;
  if(extra?.castle){const[rfr,rfc]=sq(extra.rookFrom),[rtr,rtc]=sq(extra.rookTo);b[rtr][rtc]=b[rfr][rfc];b[rfr][rfc]=null;}
  if(extra?.enPassant){const[epr,epc]=sq(extra.enPassant);b[epr][epc]=null;}
  return b;
};

const parseFEN = (fen) => {
  const parts = fen.split(' ');
  const ranks = parts[0].split('/');
  const board = [];
  for (const rank of ranks) {
    const row = [];
    for (const ch of rank) {
      if (ch >= '1' && ch <= '8') for (let i = 0; i < parseInt(ch); i++) row.push(null);
      else row.push(ch);
    }
    board.push(row);
  }
  return { board, turn: parts[1] };
};

const applyUciMove = (board, uci) => {
  const b = board.map(r=>[...r]);
  const fc = uci.charCodeAt(0)-97, fr = 8-parseInt(uci[1]);
  const tc = uci.charCodeAt(2)-97, tr = 8-parseInt(uci[3]);
  const piece = b[fr][fc];
  b[tr][tc] = piece; b[fr][fc] = null;
  
  if ((piece === 'K' || piece === 'k') && Math.abs(tc-fc) >= 2) {
    if (tc > fc) { b[fr][5] = b[fr][7]; b[fr][7] = null; }
    else { b[fr][3] = b[fr][0]; b[fr][0] = null; }
  }
  if ((piece === 'P' || piece === 'p') && fc !== tc && !board[tr][tc]) {
    b[fr][tc] = null;
  }
  if (uci.length === 5) {
    const promo = uci[4];
    b[tr][tc] = piece === piece.toUpperCase() ? promo.toUpperCase() : promo.toLowerCase();
  }
  return b;
};

const countPieces = (board) => board.flat().filter(Boolean).length;

const getSuggestedTime = (rating, totalMoves) => {
  // Blitz-realistic timing: ~5-15 seconds per player move, capped at 25s total
  const playerMoves = Math.max(1, Math.ceil((totalMoves - 1) / 2));
  let perMove;
  if (rating < 1200) perMove = 5;
  else if (rating < 1600) perMove = 7;
  else if (rating < 2000) perMove = 9;
  else if (rating < 2400) perMove = 12;
  else perMove = 15;
  return Math.min(perMove * playerMoves, 25) * 1000;
};

const initSR = () => { const d = {}; OPENINGS.forEach(o => { d[o.id] = {box:1,correct:0,incorrect:0,lastDrilled:0,streak:0}; }); return d; };
const boxIntervals = {1:1,2:2,3:4,4:8,5:16};
const boxLabels = {1:"New",2:"Learning",3:"Familiar",4:"Solid",5:"Mastered"};
const boxColors = {
  1:{bg:"#FEE2E2",border:"#EF4444",text:"#DC2626",dot:"#EF4444"},
  2:{bg:"#FFF7ED",border:"#E8722A",text:"#C2410C",dot:"#E8722A"},
  3:{bg:"#FEF9C3",border:"#EAB308",text:"#A16207",dot:"#EAB308"},
  4:{bg:"#DCFCE7",border:"#22C55E",text:"#15803D",dot:"#22C55E"},
  5:{bg:"#E0F2FE",border:"#0EA5E9",text:"#0369A1",dot:"#0EA5E9"},
};
const getNextDrill = (sr, session) => {
  const due = OPENINGS.filter(o => { const s = sr[o.id]; return s && session - s.lastDrilled >= boxIntervals[s.box]; });
  if (!due.length) return OPENINGS.reduce((best, o) => (!best || (sr[o.id]?.box||1) < (sr[best.id]?.box||1)) ? o : best, null);
  due.sort((a, b) => (sr[a.id]?.box||1) - (sr[b.id]?.box||1)); return due[0];
};
const getActiveMoves = (opening, branch) => {
  if (!opening.branchAt) return opening.moves;
  if (branch !== null && opening.branches?.[branch]) return [...opening.moves, ...opening.branches[branch].continuation];
  return opening.moves;
};

const DrillView = ({ opening, sr, setSR, session, onBack }) => {
  const [board,setBoard]=useState(INIT_BOARD());const [moveIndex,setMoveIndex]=useState(0);const [selected,setSelected]=useState(null);
  const [lastMove,setLastMove]=useState(null);const [wrongMove,setWrongMove]=useState(null);const [correctSquare,setCorrectSquare]=useState(null);const [correctFrom,setCorrectFrom]=useState(null);const [correctSan,setCorrectSan]=useState(null);
  const [status,setStatus]=useState("playing");const [moveHistory,setMoveHistory]=useState([]);const [mistakes,setMistakes]=useState(0);
  const [showHint,setShowHint]=useState(false);const [activeBranch,setActiveBranch]=useState(null);const [branchName,setBranchName]=useState(null);
  const timerRef=useRef(null);const isUserWhite=opening.color==="white";
  const activeMoves=useMemo(()=>getActiveMoves(opening,activeBranch),[opening,activeBranch]);
  const isUserTurn=useCallback(idx=>isUserWhite?idx%2===0:idx%2===1,[isUserWhite]);
  useEffect(()=>{setBoard(INIT_BOARD());setMoveIndex(0);setSelected(null);setLastMove(null);setWrongMove(null);setCorrectSquare(null);setCorrectFrom(null);setCorrectSan(null);setStatus("playing");setMoveHistory([]);setMistakes(0);setShowHint(false);setActiveBranch(null);setBranchName(null);},[opening.id]);
  useEffect(()=>{if(status!=="playing"||moveIndex>=activeMoves.length)return;if(!isUserTurn(moveIndex)){timerRef.current=setTimeout(()=>{const move=activeMoves[moveIndex];setBoard(prev=>applyMove(prev,move.from,move.to,move.extra));setLastMove({from:sq(move.from),to:sq(move.to)});setMoveHistory(prev=>[...prev,move.san]);setMoveIndex(prev=>prev+1);setSelected(null);setShowHint(false);},500);return()=>clearTimeout(timerRef.current);}},[moveIndex,status,activeMoves,isUserTurn]);
  useEffect(()=>{if(moveIndex>=activeMoves.length&&status==="playing"&&(activeBranch!==null||!opening.branchAt)){setStatus("complete");setSR(prev=>{const s={...prev[opening.id]};if(mistakes===0){s.correct++;s.streak++;s.box=Math.min(5,s.box+1);}else{s.incorrect++;s.streak=0;s.box=Math.max(1,s.box-1);}s.lastDrilled=session;return{...prev,[opening.id]:s};});}},[moveIndex,activeMoves,status,mistakes,session,setSR,opening,activeBranch]);
  const handleSquareClick=(r,c)=>{
    if(status!=="playing"||!isUserTurn(moveIndex))return;
    if(wrongMove){setWrongMove(null);setCorrectSquare(null);setCorrectFrom(null);setCorrectSan(null);}
    if(opening.branchAt!==undefined&&moveIndex===opening.branchAt&&activeBranch===null){
      if(!selected){if(board[r][c]){const p=board[r][c];if(isUserWhite?p===p.toUpperCase():p===p.toLowerCase())setSelected([r,c]);}return;}
      if(selected[0]===r&&selected[1]===c){setSelected(null);return;}
      if(board[r][c]){const p=board[r][c];if(isUserWhite?p===p.toUpperCase():p===p.toLowerCase()){setSelected([r,c]);return;}}
      for(let bi=0;bi<opening.branches.length;bi++){
        const t=opening.branches[bi].continuation[0];const[tfr,tfc]=sq(t.from),[ttr,ttc]=sq(t.to);
        if(selected[0]===tfr&&selected[1]===tfc&&r===ttr&&c===ttc){
          setActiveBranch(bi);setBranchName(opening.branches[bi].name);
          setBoard(prev=>applyMove(prev,t.from,t.to,t.extra));setLastMove({from:[tfr,tfc],to:[ttr,ttc]});
          setMoveHistory(prev=>[...prev,t.san]);setMoveIndex(prev=>prev+1);setSelected(null);setShowHint(false);return;
        }
      }
      setWrongMove([r,c]);setMistakes(prev=>prev+1);setSelected(null);
      setTimeout(()=>{setWrongMove(null);setCorrectSquare(null);},1500);return;
    }
    if(moveIndex>=activeMoves.length)return;
    const em=activeMoves[moveIndex];const[efr,efc]=sq(em.from),[etr,etc]=sq(em.to);
    if(!selected){if(board[r][c]){const p=board[r][c];if(isUserWhite?p===p.toUpperCase():p===p.toLowerCase())setSelected([r,c]);}}
    else{
      if(selected[0]===r&&selected[1]===c){setSelected(null);return;}
      if(board[r][c]){const p=board[r][c];if(isUserWhite?p===p.toUpperCase():p===p.toLowerCase()){setSelected([r,c]);return;}}
      if(selected[0]===efr&&selected[1]===efc&&r===etr&&c===etc){
        setBoard(prev=>applyMove(prev,em.from,em.to,em.extra));setLastMove({from:[efr,efc],to:[etr,etc]});
        setMoveHistory(prev=>[...prev,em.san]);setMoveIndex(prev=>prev+1);setSelected(null);setShowHint(false);
      }else{setWrongMove([r,c]);setCorrectSquare([etr,etc]);setCorrectFrom([efr,efc]);setCorrectSan(em.san);setMistakes(prev=>prev+1);setSelected(null);setTimeout(()=>{setWrongMove(null);setCorrectSquare(null);setCorrectFrom(null);setCorrectSan(null);},2000);}

  };

      setResults({total:parsed.length,openings:Object.entries(byC).sort((a,b)=>b[1].count-a[1].count)});
    }catch(e){setError("Error: "+e.message);}setLoading(false);
  };
  return(

};

      beginner: [400, 1200],
      intermediate: [1200, 1600],
      advanced: [1600, 2000],
      expert: [2000, 2400],
      master: [2400, 3500],
    };
    return ranges[diff] || null;
  };

      if (!res.ok) throw new Error('API error');
      const data = await res.json();
      fetchingRef.current = false;
      return data.puzzles || [];

      console.error('Lichess fetch error:', e);

      {status==="playing"&&(
        <div className="w-full flex items-center justify-between">
          <a href={`https://lichess.org/training/${puzzle.id}`} target="_blank" rel="noopener noreferrer" style={{fontSize:11,color:"#A78BFA",textDecoration:"none",opacity:0.7}}>Lichess #{puzzle.id}</a>
          <button onClick={()=>{setShowHint(true);setMistakes(prev=>prev+1);}} style={{padding:"6px 14px",borderRadius:10,background:"#FFFFFF",color:"#5B4DA0",fontSize:13,fontWeight:600,border:"1.5px solid #E2DFD6",cursor:"pointer",boxShadow:"0 1px 3px rgba(45,43,107,0.06)"}}>
            {showHint&&puzzle.solutionUci[solutionIndex]?`Play ${puzzle.solutionUci[solutionIndex]}`:"Hint 💡"}
          </button>
        </div>
      )}

      {sessionResults.length > 0 && (
        <div className="w-full flex items-center gap-1.5 flex-wrap">
          <span style={{fontSize:11,color:"#8B8BA0",fontWeight:600,marginRight:4}}>Session:</span>
          {sessionResults.map((r,i)=>(
            <div key={i} style={{fontSize:11,padding:"2px 8px",borderRadius:99,fontWeight:600,
              background:r.perfect?"#DCFCE7":"#FEE2E2",
              border:`1.5px solid ${r.perfect?"#22C55E40":"#EF444440"}`,
              color:r.perfect?"#15803D":"#DC2626",
            }} title={`Rating ${r.rating}`}>{r.perfect?"✓":"✕"} {r.rating}</div>
          ))}
        </div>
      )}
    </div>
  );
};


function App() {
  const [sr,setSR]=useState(initSR);const [session,setSession]=useState(1);const [view,setView]=useState("dashboard");
  const [currentOpening,setCurrentOpening]=useState(null);const [filter,setFilter]=useState("all");
  useEffect(()=>{setSR(prev=>{const n={...prev};OPENINGS.forEach(o=>{if(!n[o.id])n[o.id]={box:1,correct:0,incorrect:0,lastDrilled:0,streak:0};});return n;});},[]);
  const startDrill=o=>{setCurrentOpening(o);setView("drill");};
  const smartDrill=()=>{const n=getNextDrill(sr,session);if(n)startDrill(n);};
  const handleBack=()=>{setView("dashboard");setSession(prev=>prev+1);};
  const totalC=Object.values(sr).reduce((s,v)=>s+(v.correct||0),0);
  const totalI=Object.values(sr).reduce((s,v)=>s+(v.incorrect||0),0);
  const avgBox=(Object.values(sr).reduce((s,v)=>s+(v.box||1),0)/OPENINGS.length).toFixed(1);
  const solidCount=Object.values(sr).filter(v=>(v.box||1)>=4).length;
  const filtered=filter==="all"?OPENINGS:OPENINGS.filter(o=>o.color===filter);
  if(view==="import")return(<div style={{minHeight:"100vh",padding:16,background:"#F5F0E8"}}><ChessComImport onBack={handleBack}/></div>);
  if(view==="blind")return(<div style={{minHeight:"100vh",padding:16,display:"flex",justifyContent:"center",background:"#F5F0E8"}}><BlindDrillView sr={sr} setSR={setSR} session={session} onBack={handleBack}/></div>);
  if(view==="tactics")return(<div style={{minHeight:"100vh",padding:16,display:"flex",justifyContent:"center",background:"#F5F0E8"}}><TacticsView onBack={handleBack}/></div>);
  if(view==="drill"&&currentOpening)return(<div style={{minHeight:"100vh",padding:16,display:"flex",justifyContent:"center",background:"#F5F0E8"}}><DrillView opening={currentOpening} sr={sr} setSR={setSR} session={session} onBack={handleBack}/></div>);
  const Row=({o})=>{const s=sr[o.id]||{box:1,streak:0};const bc=boxColors[s.box];return(
    <button onClick={()=>startDrill(o)} style={{
      width:"100%",textAlign:"left",padding:"12px 16px",borderRadius:14,border:`1.5px solid ${bc.border}40`,
      background:"#FFFFFF",cursor:"pointer",transition:"all 0.15s",display:"block",
      boxShadow:"0 1px 3px rgba(45,43,107,0.06)",
    }}
    onMouseOver={e=>{e.currentTarget.style.transform="translateX(3px)";e.currentTarget.style.boxShadow="0 4px 12px rgba(45,43,107,0.1)";}}
    onMouseOut={e=>{e.currentTarget.style.transform="none";e.currentTarget.style.boxShadow="0 1px 3px rgba(45,43,107,0.06)";}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div><span style={{fontWeight:700,color:"#1A1A2E",fontSize:14}}>{o.name}</span><span style={{color:"#8B8BA0",fontSize:12,marginLeft:8}}>{o.eco}</span>{o.branchAt!==undefined&&<span style={{color:"#7C3AED",fontSize:12,marginLeft:4}}>🔀</span>}</div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {s.streak>=3&&<span style={{fontSize:12}}>🔥{s.streak}</span>}
          <div style={{width:8,height:8,borderRadius:4,background:bc.dot}}/>
          <span style={{fontSize:12,fontWeight:700,color:bc.text}}>{boxLabels[s.box]}</span>
        </div>
      </div>
      <div style={{fontSize:11,color:"#8B8BA0",marginTop:3}}>{o.category} • {o.branchAt?`${o.moves.length}+branch`:o.moves.length} moves{o.mistakes?.length>0?" • 💥":""}</div>
    </button>
  );};
  return(
    <div style={{minHeight:"100vh",padding:16,background:"#F5F0E8"}}>
      <style>{`@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }`}</style>
      <div className="max-w-xl mx-auto" style={{animation:"fadeIn 0.4s ease"}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          <h1 style={{fontSize:30,fontWeight:900,color:"#2D2B6B",letterSpacing:"-0.03em",fontFamily:"-apple-system,BlinkMacSystemFont,'SF Pro Rounded',sans-serif",margin:0}}>♔ Chess Trainer</h1>
          <p style={{color:"#8B8BA0",fontSize:13,margin:"6px 0 0",fontWeight:500}}>Openings • Tactics • Blind drill — Master chess faster</p>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:8,marginBottom:20}}>
          {[{l:"Drilled",v:totalC+totalI,i:"📊"},{l:"Accuracy",v:totalC+totalI>0?Math.round(totalC/(totalC+totalI)*100)+"%":"—",i:"🎯"},{l:"Avg Box",v:avgBox,i:"📈"},{l:"Solid+",v:`${solidCount}/${OPENINGS.length}`,i:"⭐"}].map(({l,v,i})=>(
            <div key={l} style={{background:"#FFFFFF",borderRadius:14,padding:"12px 8px",textAlign:"center",boxShadow:"0 1px 3px rgba(45,43,107,0.06)"}}>
              <div style={{fontSize:20,fontWeight:800,color:"#2D2B6B"}}>{v}</div>
              <div style={{fontSize:11,color:"#8B8BA0",fontWeight:500}}>{i} {l}</div>
            </div>
          ))}
        </div>
        <button onClick={smartDrill} style={{width:"100%",marginBottom:10,padding:"16px 0",borderRadius:16,fontWeight:800,fontSize:17,background:"#E8722A",color:"white",border:"none",cursor:"pointer",boxShadow:"0 4px 20px rgba(232,114,42,0.3)",letterSpacing:"-0.01em",transition:"transform 0.1s",}} onMouseDown={e=>e.currentTarget.style.transform="scale(0.98)"} onMouseUp={e=>e.currentTarget.style.transform="scale(1)"}>⚡ Learn Openings</button>
        <button onClick={()=>setView("blind")} style={{width:"100%",marginBottom:10,padding:"16px 0",borderRadius:16,fontWeight:800,fontSize:17,background:"#5B4DA0",color:"white",border:"none",cursor:"pointer",boxShadow:"0 4px 20px rgba(91,77,160,0.3)",letterSpacing:"-0.01em",transition:"transform 0.1s",}} onMouseDown={e=>e.currentTarget.style.transform="scale(0.98)"} onMouseUp={e=>e.currentTarget.style.transform="scale(1)"}>🎲 Practice Openings</button>
        <button onClick={()=>setView("tactics")} style={{width:"100%",marginBottom:10,padding:"16px 0",borderRadius:16,fontWeight:800,fontSize:17,background:"linear-gradient(135deg, #059669, #10B981)",color:"white",border:"none",cursor:"pointer",boxShadow:"0 4px 20px rgba(5,150,105,0.3)",letterSpacing:"-0.01em",transition:"transform 0.1s",}} onMouseDown={e=>e.currentTarget.style.transform="scale(0.98)"} onMouseUp={e=>e.currentTarget.style.transform="scale(1)"}>🧩 Practice Tactics</button>
        <button onClick={()=>setView("import")} style={{width:"100%",marginBottom:20,padding:"12px 0",borderRadius:14,fontWeight:600,fontSize:13,background:"#FFFFFF",color:"#5B4DA0",border:"1.5px solid #E2DFD6",cursor:"pointer",boxShadow:"0 1px 3px rgba(45,43,107,0.04)"}}>📥 Import from Chess.com</button>
        <div style={{display:"flex",gap:6,marginBottom:16}}>
          {["all","white","black"].map(f=>(
            <button key={f} onClick={()=>setFilter(f)} style={{
              padding:"6px 16px",borderRadius:99,fontSize:13,fontWeight:600,cursor:"pointer",transition:"all 0.15s",
              background:filter===f?"#2D2B6B":"#FFFFFF",
              color:filter===f?"#FFFFFF":"#8B8BA0",
              border:`1.5px solid ${filter===f?"#2D2B6B":"#E2DFD6"}`,
              boxShadow:filter===f?"0 2px 8px rgba(45,43,107,0.2)":"none",
            }}>{f==="all"?"All Lines":f==="white"?"♔ White":"♚ Black"}</button>
          ))}
        </div>
        {filtered.filter(o=>o.color==="white").length>0&&(filter==="all"||filter==="white")&&(
          <div style={{marginBottom:16}}>
            {filter==="all"&&<div style={{fontSize:11,fontWeight:800,color:"#5B4DA0",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8,paddingLeft:4}}>White Repertoire</div>}
            <div style={{display:"flex",flexDirection:"column",gap:8}}>{filtered.filter(o=>o.color==="white").map(o=><Row key={o.id} o={o}/>)}</div>
          </div>
        )}
        {filtered.filter(o=>o.color==="black").length>0&&(filter==="all"||filter==="black")&&(
          <div style={{marginBottom:16}}>
            {filter==="all"&&<div style={{fontSize:11,fontWeight:800,color:"#5B4DA0",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8,paddingLeft:4}}>Black Repertoire</div>}
            <div style={{display:"flex",flexDirection:"column",gap:8}}>{filtered.filter(o=>o.color==="black").map(o=><Row key={o.id} o={o}/>)}</div>
          </div>
        )}
        <div style={{marginTop:24,padding:16,borderRadius:16,background:"#FFFFFF",boxShadow:"0 1px 3px rgba(45,43,107,0.06)",fontSize:13,color:"#6B6B80"}}>
          <div style={{fontWeight:800,color:"#2D2B6B",marginBottom:8}}>How This Works</div>
          <p style={{margin:"0 0 8px"}}><span style={{color:"#1A1A2E",fontWeight:600}}>Leitner spaced repetition</span> — 5 mastery boxes. Perfect runs promote, mistakes demote.</p>
          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
            {[1,2,3,4,5].map(b=><span key={b} style={{display:"inline-flex",alignItems:"center",gap:4,padding:"3px 10px",borderRadius:99,fontSize:11,fontWeight:600,background:boxColors[b].bg,color:boxColors[b].text,border:`1.5px solid ${boxColors[b].border}50`}}><span style={{width:6,height:6,borderRadius:3,background:boxColors[b].dot}}/>{boxLabels[b]}</span>)}
          </div>
          <p style={{margin:"0 0 4px"}}><span style={{color:"#1A1A2E",fontWeight:600}}>🎲 Blind</span> — random color, hidden name. <span style={{color:"#1A1A2E",fontWeight:600}}>💥 Curveball Mode</span> — opponent blunders, you punish.</p>
          <p style={{margin:"0 0 4px"}}><span style={{color:"#1A1A2E",fontWeight:600}}>🧩 Tactics</span> — solve puzzles with dynamic difficulty. Rated puzzles from beginner to master level.</p>
          <p style={{margin:0}}><span style={{color:"#1A1A2E",fontWeight:600}}>🔀 Branching</span> — Scotch Nxc6: choose Schmidt (e5) or Mieses (Bd3) at the branch.</p>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
